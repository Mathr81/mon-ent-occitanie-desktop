<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Double authentification</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">Double authentification</h2>
    <p class="text-gray-500 text-sm text-center mb-5">
      École Directe demande une vérification. La réponse est mémorisée pour les prochaines connexions.
    </p>

    <p id="question" class="text-gray-800 font-medium text-center mb-4"></p>
    <div id="propositions" class="space-y-2 max-h-80 overflow-y-auto"></div>
  </div>

  <script>
    const { ipcRenderer } = require("electron");

    ipcRenderer.on("twofa-question", (event, { question, propositions }) => {
      document.getElementById("question").textContent = question;

      const container = document.getElementById("propositions");
      container.innerHTML = "";

      propositions.forEach((proposition) => {
        const button = document.createElement("button");
        button.textContent = proposition;
        button.className =
          "w-full bg-indigo-600 text-white font-semibold py-2 px-3 rounded-lg shadow hover:bg-indigo-500 transition duration-200 text-left";
        button.addEventListener("click", () => {
          container.querySelectorAll("button").forEach((b) => {
            b.disabled = true;
            b.className += " opacity-50 cursor-not-allowed";
          });
          ipcRenderer.send("twofa-answer", proposition);
        });
        container.appendChild(button);
      });
    });
  </script>

</body>
</html>
